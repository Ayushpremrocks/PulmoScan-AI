name: Keep Streamlit app awake

on:
  schedule:
    # Every 6 hours (times are UTC). Community Cloud sleeps apps after a period with no visitors.
    - cron: "0 */6 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install playwright==1.49.0
          python -m playwright install --with-deps chromium

      - name: Visit the app
        env:
          # Set these as repository variables to override (Settings → Secrets and variables → Actions → Variables).
          APP_URL: ${{ vars.APP_URL }}
          APP_TEXT: ${{ vars.APP_TEXT }}
        run: python scripts/keep_alive.py

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-alive-failure
          path: keep-alive-failure.png
          if-no-files-found: ignore
