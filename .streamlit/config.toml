# Clean light/dark theme (users can switch in Settings). No custom CSS needed.

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
baseFontSize = 15
headingFontSizes = ["32px", "24px", "20px", "17px", "15px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "28px"

[theme.light]
primaryColor = "#0E7490"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
linkColor = "#0E7490"
borderColor = "#E2E8F0"
grayColor = "#64748B"
greenColor = "#16A34A"
redColor = "#DC2626"
chartCategoricalColors = ["#0E7490", "#EA580C", "#7C3AED", "#16A34A"]
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"

[theme.dark]
primaryColor = "#22D3EE"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111827"
textColor = "#F1F5F9"
linkColor = "#67E8F9"
borderColor = "#1F2937"
grayColor = "#94A3B8"
greenColor = "#4ADE80"
redColor = "#F87171"
chartCategoricalColors = ["#22D3EE", "#FB923C", "#A78BFA", "#4ADE80"]
dataframeBorderColor = "#1F2937"
dataframeHeaderBackgroundColor = "#111827"

[server]
maxUploadSize = 20
